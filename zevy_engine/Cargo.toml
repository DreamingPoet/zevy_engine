[package]
name = "zevy_engine"
version = "0.1.0"
edition = "2024"
default-run = "zevy_engine"

[features]
default = ["render_debug"]
render_debug = ["bevy/bevy_ui", "bevy/sysinfo_plugin"]

[lib]
name = "zevy_engine"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
bevy = { version = "0.16.1", default-features = false, features = [
    "std",
    "async_executor",
    "android-native-activity",
    "android_shared_stdcxx",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_gltf",
    "bevy_log",
    "bevy_pbr",
    "bevy_render",
    "bevy_scene",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "hdr",
    "multi_threaded",
    "png",
    "tonemapping_luts",
    "x11",
] }
bevy_mod_openxr = "0.3.0"
bevy_mod_xr = "0.3.0"
bevy_xr_utils = "0.3.0"
image = { version = "0.25.9", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
openxr = "0.19"

[patch.crates-io]
bevy_pbr = { path = "third_party/crates/bevy_pbr-0.16.1" }
bevy_mod_openxr = { path = "third_party/crates/bevy_mod_openxr-0.3.0" }
bevy_mod_xr = { path = "third_party/crates/bevy_mod_xr-0.3.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"
panic = "abort"

[package.metadata.android]
package = "com.zevy.engine"
build_targets = ["aarch64-linux-android"]
assets = "assets"
runtime_libs = "third_party/pico_openxr_loader"
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "org.khronos.openxr.permission.OPENXR"

[[package.metadata.android.uses_permission]]
name = "android.permission.CHANGE_CONFIGURATION"

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_SETTINGS"

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
required = true
version = 1

[[package.metadata.android.uses_feature]]
name = "android.hardware.vr.headtracking"
required = true

[[package.metadata.android.queries.provider]]
name = "org.khronos.openxr"
authorities = "org.khronos.openxr.runtime_broker;org.khronos.openxr.system_runtime_broker"

[[package.metadata.android.queries.package]]
name = "com.pico.xr.openxr_runtime"

[package.metadata.android.application]
label = "zevy_engine"
theme = "@android:style/Theme.Black.NoTitleBar.Fullscreen"
hardware_accelerated = false

[package.metadata.android.application.activity]
config_changes = "density|keyboard|keyboardHidden|navigation|orientation|screenLayout|screenSize|uiMode"
launch_mode = "singleTask"
orientation = "landscape"
resizeable_activity = false

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = [
    "android.intent.category.LAUNCHER",
    "com.picovr.intent.category.VR",
]

[[package.metadata.android.application.meta_data]]
name = "pvr.app.type"
value = "vr"

[[package.metadata.android.application.meta_data]]
name = "pvr.sdk.version"
value = "ZevyEngine_OpenXR"

[[package.metadata.android.application.meta_data]]
name = "pxr.sdk.2dloading.flag"
value = "system"

[[package.metadata.android.application.meta_data]]
name = "pxr.sdk.version_code"
value = "5130"

[[package.metadata.android.application.meta_data]]
name = "pvr.app.splash"
value = "0"

[[package.metadata.android.application.meta_data]]
name = "controller"
value = "1"
